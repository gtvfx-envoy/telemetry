[package]
name = "telemetry-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lifecycle controller for the envoy telemetry bundle's shared studio infrastructure (Collector, Tempo, Grafana, file-drop ingestion sweep)."

[[bin]]
name = "telemetry-controller"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
rand = "0.8"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
sysinfo = "0.32"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
