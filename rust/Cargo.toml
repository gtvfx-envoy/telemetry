[workspace]
resolver = "2"
members = ["telemetry-controller"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# GPL-3.0, matching ../LICENSE (this bundle is released independently from
# `envoy` itself, but under the same license family).
license = "GPL-3.0-or-later"
repository = "https://github.com/gtvfx-envoy/telemetry"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
