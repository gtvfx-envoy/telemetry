apiVersion: 1

# Provisions the Tempo datasource used by the "Envoy Command Telemetry"
# dashboard. Tempo is reachable only from within the compose network
# (never exposed directly to the host or studio network), matching the
# plan's requirement that Tempo stay private to the Collector/Grafana.
datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogs: {}
      # TraceQL metrics only in v1 -- no Prometheus/Loki/Mimir datasource
      # is provisioned alongside this one.
      streamingEnabled:
        search: true
