name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target_name: windows-x86_64
            binary_name: telemetry-controller.exe
          - runner: ubuntu-24.04
            target_name: linux-x86_64
            binary_name: telemetry-controller
          - runner: macos-15-intel
            target_name: macos-x86_64
            binary_name: telemetry-controller
          - runner: macos-15
            target_name: macos-aarch64
            binary_name: telemetry-controller
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release binary
        working-directory: rust
        run: cargo build --release -p telemetry-controller

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-controller-${{ matrix.target_name }}
          path: rust/target/release/${{ matrix.binary_name }}
          if-no-files-found: error
