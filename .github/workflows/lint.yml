name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  rust:
    name: Rust (fmt + clippy + test) - ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os_name: Linux
          - runner: windows-2025
            os_name: Windows
          - runner: macos-15
            os_name: macOS
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: rust

      # fmt / clippy / tests are three *independent* checks. Without the
      # `!cancelled()` guards below, a step's default condition is "all
      # previous steps succeeded", so a trivial formatting failure
      # short-circuits the job before Clippy and the tests ever run --
      # hiding real compile errors and test failures until someone happens
      # to run them locally. `!cancelled()` (rather than `always()`) still
      # lets an explicit workflow cancellation stop the job promptly.
      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: Run cargo clippy
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run cargo test
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo test --locked --workspace
