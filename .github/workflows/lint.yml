name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  rust:
    name: Rust (fmt + clippy + test) - ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os_name: Linux
          - runner: windows-2025
            os_name: Windows
          - runner: macos-15
            os_name: macOS
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # fmt / clippy / tests are three *independent* checks. Without the
      # `!cancelled()` guards below, a step's default condition is "all
      # previous steps succeeded", so a trivial formatting failure
      # short-circuits the job before Clippy and the tests ever run --
      # hiding real compile errors and test failures until someone happens
      # to run them locally. `!cancelled()` (rather than `always()`) still
      # lets an explicit workflow cancellation stop the job promptly.
      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: Run cargo clippy
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo test
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo test --workspace
