name: Validate bundle configuration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-configs:
    name: Validate Compose / Collector / Tempo / Grafana / dashboard configs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate docker-compose.yml syntax
        working-directory: compose
        # docker compose interpolates the whole file up front, including
        # required (`:?`) env var references (see AGENTS/copilot
        # instructions) -- so all required values must be set here even
        # though this step never actually starts anything.
        env:
          COLLECTOR_BEARER_TOKEN: ci-placeholder-token
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-password
          GRAFANA_VIEWER_PASSWORD: ci-placeholder-password
          TEMPO_CONFIG_DIR: ./tempo
        run: docker compose config --quiet

      - name: Validate Collector and Tempo YAML are well-formed
        run: |
          python3 -c "import yaml, sys; yaml.safe_load(open('compose/otel-collector-config.yaml'))"
          python3 -c "import yaml, sys; yaml.safe_load(open('compose/tempo/tempo.yaml'))"
          python3 -c "import yaml, sys; yaml.safe_load(open('compose/grafana/provisioning/datasources/tempo.yaml'))"
          python3 -c "import yaml, sys; yaml.safe_load(open('compose/grafana/provisioning/dashboards/dashboards.yaml'))"

      - name: Validate dashboard JSON is well-formed
        run: python3 -c "import json; json.load(open('compose/grafana/dashboards/envoy-command-telemetry.json'))"

      - name: Require VERSIONS.lock and THIRD_PARTY_LICENSES to exist
        run: |
          test -f VERSIONS.lock
          test -f THIRD_PARTY_LICENSES/README.md

      - name: Fail if any image reference uses the `latest` tag
        run: |
          if grep -E "image:\s*\S+:latest" compose/docker-compose.yml; then
            echo "::error::docker-compose.yml must never pin an image to :latest"
            exit 1
          fi

  publish-dry-run:
    name: engit publish bundle --dry-run
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout telemetry bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: telemetry

      - name: Install checksummed Engit v0.3.0
        env:
          GH_TOKEN: ${{ github.token }}
          ENGIT_SHA256: 412695dfbf427986875b34330478ff50b4a76fa6fee6a5ba82d50406c246d919
        run: |
          asset=envoy_utils-v0.3.0-linux-x86_64-musl.tar.gz
          mkdir -p "${RUNNER_TEMP}/engit/bundle"
          gh release download v0.3.0 \
            --repo gtvfx-envoy/envoy_utils \
            --pattern "$asset" \
            --dir "${RUNNER_TEMP}/engit"
          actual="$(sha256sum "${RUNNER_TEMP}/engit/$asset" | awk '{print $1}')"
          test "$actual" = "$ENGIT_SHA256"
          tar -xzf "${RUNNER_TEMP}/engit/$asset" -C "${RUNNER_TEMP}/engit/bundle"
          engit="$(find "${RUNNER_TEMP}/engit/bundle" -type f -name engit -print -quit)"
          test -n "$engit"
          echo "$(dirname "$engit")" >> "$GITHUB_PATH"

      - name: Stage placeholder artifacts for the dry run
        # A real publish resolves real controller binaries via
        # ${ENVOY_STUDIO_ARTIFACTS}; --dry-run only needs to see that the
        # manifest's `source` paths exist and resolve, so placeholders are
        # enough to validate the manifest itself here.
        run: |
          mkdir -p staged/telemetry/controller/windows-x86_64 staged/telemetry/controller/linux-x86_64 \
            staged/telemetry/controller/macos-x86_64 staged/telemetry/controller/macos-aarch64
          touch staged/telemetry/controller/windows-x86_64/telemetry-controller.exe
          touch staged/telemetry/controller/linux-x86_64/telemetry-controller
          touch staged/telemetry/controller/macos-x86_64/telemetry-controller
          touch staged/telemetry/controller/macos-aarch64/telemetry-controller

      - name: Run engit publish bundle --dry-run
        working-directory: telemetry
        env:
          ENVOY_STUDIO_ARTIFACTS: ${{ github.workspace }}/staged
        # --version dev: this repo won't have a semver tag until its first
        # real release (engit's own documented flag for exactly this --
        # see `engit publish bundle --help`), and this check only needs to
        # validate the manifest/bundle structure, not real version
        # resolution.
        # --output dist: engit requires an output root (--output or
        # ENVOY_BUNDLE_PUBLISH_ROOT/ENVOY_BNDLE_PROD) even for --dry-run,
        # which writes nothing regardless of this value. `dist` matches
        # the convention already used by envoy's own release workflow
        # (`engit publish bundle --zip --output dist`).
        run: engit publish bundle --dry-run --version dev --output dist

  compose-smoke:
    name: Start stack and verify both ingestion paths
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Bookworm-compatible Linux controller
        run: |
          mkdir -p bin/linux-x86_64 "${RUNNER_TEMP}/cargo-target"
          docker run --rm \
            -e CARGO_TARGET_DIR=/target \
            -v "${GITHUB_WORKSPACE}/rust:/workspace:ro" \
            -v "${RUNNER_TEMP}/cargo-target:/target" \
            -v "${GITHUB_WORKSPACE}/bin/linux-x86_64:/output" \
            -w /workspace \
            rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073 \
            sh -c 'cargo build --locked --release -p telemetry-controller && cp /target/release/telemetry-controller /output/'

      - name: Verify smoke test preserves pre-existing project resources
        env:
          COMPOSE_PROJECT_NAME: telemetry-safety-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          volume_name="${COMPOSE_PROJECT_NAME}-sentinel"
          docker volume create \
            --label "com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
            "$volume_name" >/dev/null
          trap 'docker volume rm "$volume_name" >/dev/null' EXIT

          if bash scripts/smoke-compose.sh \
            "${GITHUB_WORKSPACE}/bin/linux-x86_64/telemetry-controller" \
            "${RUNNER_TEMP}/telemetry-safety-state"; then
            echo "::error::Smoke test accepted a Compose project with existing resources"
            exit 1
          fi
          docker volume inspect "$volume_name" >/dev/null

      - name: Run Compose smoke test
        env:
          COMPOSE_PROJECT_NAME: telemetry-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bash scripts/smoke-compose.sh \
            "${GITHUB_WORKSPACE}/bin/linux-x86_64/telemetry-controller" \
            "${RUNNER_TEMP}/telemetry-state" \
            "${RUNNER_TEMP}/telemetry-drop"
