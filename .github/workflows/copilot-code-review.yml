name: Copilot Code Review Setup

# Configures the runner used by Copilot code review's agentic capability.
# Without this file, Copilot's own review comment on PR #1 reported:
# "Copilot couldn't run its full agentic review because it didn't start
# before the timeout." Copilot code review is only compatible with Ubuntu
# x64 Linux runners (Windows/macOS are not supported for this feature) --
# see https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-runners
#
# The job below must be named exactly `copilot-setup-steps` -- this is the
# magic name GitHub looks for. Only `steps`, `permissions`, `runs-on`,
# `services`, `snapshot`, and `timeout-minutes` are honored on this job;
# everything else is ignored. It cannot be a reusable-workflow `uses:` call
# (as our other shared workflows are, e.g. envoy_utils's bundle-publish.yml),
# since that job shape has no `runs-on` of its own for Copilot to read.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No environment customization needed -- this job exists solely to
      # pin runs-on to a supported Linux runner. `steps` is a required
      # field for a normal (non reusable-workflow-call) job, so a no-op
      # placeholder satisfies that without adding unnecessary setup.
      - name: No-op
        run: echo "Copilot code review runner configured (ubuntu-latest)."
